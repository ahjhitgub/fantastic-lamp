<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEW / CBEP Tracker</title>
<link rel="stylesheet" href="css/styles.css?v=4.0.0">
</head>
<body>

<header class="appbar" id="appbar">
  <div class="canopy">
    <div class="appbar-inner">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="16" cy="16" r="6.5" fill="#F3C653" stroke="none"/>
            <path d="M16 3.5v3M16 25.5v3M3.5 16h3M25.5 16h3M7.2 7.2l2.1 2.1M22.7 22.7l2.1 2.1M7.2 24.8l2.1-2.1M22.7 9.3l2.1-2.1" stroke="#F3C653" stroke-width="1.6"/>
            <path d="M16 22.5c-3.4-1.2-4.6-4.6-3.2-7.6 2.6.2 4.6 2.2 4.3 5.3M16 22.5c.9-3.2 3.3-4.8 6-4.3-.5 2.6-2.6 4.2-6 4.3" stroke="#1E3A2F" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="brand-name">CEW / CBEP Tracker<small>CalRecycle claims, <span id="app-version"></span></small></span>
      </a>
      <div class="search-box"><input id="global-search" type="search" placeholder="Search WC #, IRR #, company, name or address" autocomplete="off" aria-label="Search">
        <div id="search-results" class="search-results" hidden></div></div>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="top-nav">Menu</button>
      <nav class="topnav" id="top-nav" aria-label="Main"></nav>
    </div>
  </div>
  <div class="claim-ribbon" id="claim-ribbon">
    <div class="ribbon-inner">
      <div class="period-pill">
        <label for="period-select">Claim</label>
        <select id="period-select"></select>
      </div>
      <nav class="claim-tabs" id="claim-tabs" aria-label="Claim work"></nav>
      <span class="ribbon-hint" id="ribbon-hint"></span>
    </div>
  </div>
</header>

<main id="main-content"></main>

<!-- Core (no dependencies) -->
